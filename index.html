<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>車両点検チェックリスト（ダークモード）</title>
    <style>
        :root {
            --primary-color: #4fc3f7; /* 水色 */
            --success-color: #4CAF50; /* 緑 */
            --danger-color: #f44336;  /* 赤 */
            --text-color: #ffffff;
            --bg-color: #000000;      /* 完全な黒 */
            --card-bg: #121212;       /* わずかに明るい黒（視認性用） */
            --border-width: 2px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; /* タップ時のハイライトを消す */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh; /* 画面いっぱいに固定 */
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 全体スクロール禁止 */
        }

        /* ヘッダー・進捗バー（上部固定） */
        header {
            flex: 0 0 auto; /* 高さを固定 */
            background-color: var(--bg-color);
            padding: 10px 20px;
            z-index: 10;
            border-bottom: 1px solid #333;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background-color: #333;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--success-color);
            width: 0%;
            transition: width 0.2s ease;
        }

        /* メインコンテンツ（中央可変・スクロール可能） */
        main {
            flex: 1 1 auto; /* 残りのスペースを埋める */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto; /* ここだけスクロール */
            position: relative;
        }

        .card {
            width: 100%;
            max-width: 600px;
            text-align: center;
            /* 背景をなくして文字だけに集中させるか、薄い枠をつける */
            padding: 10px; 
        }

        .check-item-text {
            font-size: 26px; /* 文字サイズ大きめ */
            font-weight: bold;
            line-height: 1.5;
            color: var(--text-color);
        }

        /* フッター・ボタンエリア（下部固定） */
        footer {
            flex: 0 0 auto; /* 高さを固定 */
            background-color: var(--bg-color);
            padding: 15px 20px 30px 20px; /* 下部に余裕を持たせる */
            display: grid;
            grid-template-columns: 1fr 2fr; /* NG:1, OK:2の比率 */
            gap: 15px;
            z-index: 10;
            border-top: 1px solid #333;
        }

        button {
            background-color: transparent; /* 背景透明 */
            border-radius: 8px;
            padding: 18px 0;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
            color: var(--text-color);
        }

        button:active {
            transform: scale(0.98);
            background-color: #333; /* タップ時に少し明るく */
        }

        /* NGボタン（赤枠） */
        .btn-ng {
            border: var(--border-width) solid var(--danger-color);
            color: var(--danger-color);
            grid-column: 1;
        }

        /* OKボタン（緑枠） */
        .btn-ok {
            border: var(--border-width) solid var(--success-color);
            color: var(--success-color);
            grid-column: 2;
        }

        /* 戻るボタン（グレー枠・細め） */
        .btn-back {
            grid-column: 1 / -1; /* 横幅いっぱい */
            border: 1px solid #666;
            color: #aaa;
            padding: 12px 0;
            font-size: 14px;
            margin-top: 5px;
        }

        /* 結果画面スタイル */
        .result-container {
            width: 100%;
            padding-bottom: 50px;
        }

        .result-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--primary-color);
            text-align: center;
        }

        .ng-list {
            text-align: left;
            margin: 20px 0;
            border: 1px solid var(--danger-color);
            border-radius: 8px;
            padding: 15px;
            background-color: rgba(244, 67, 54, 0.1); /* 赤の極薄背景 */
        }

        .ng-list h3 {
            color: var(--danger-color);
            margin-bottom: 10px;
            font-size: 18px;
        }

        .ng-list ul {
            list-style-type: none;
            padding-left: 0;
        }

        .ng-list li {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 16px;
        }

        .result-success {
            color: var(--success-color);
            font-size: 22px;
            margin: 30px 0;
            text-align: center;
        }

        .important-note {
            border: 1px solid #ffb300;
            color: #ffb300;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            line-height: 1.6;
        }

        .btn-restart {
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            width: 100%;
            margin-top: 30px;
        }

        /* ユーティリティ */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header id="app-header">
        <div class="progress-info">
            <span id="progress-text">点検中...</span>
            <span id="status-text">1 / 80</span>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </header>

    <main id="main-content">
        <div class="card" id="card-area">
            <div class="check-item-text" id="item-text"></div>
        </div>

        <div class="result-container hidden" id="result-area">
            <h2 class="result-title">点検完了</h2>
            
            <div id="result-message"></div>

            <div id="ng-section" class="ng-list hidden">
                <h3>⚠️ NG項目 (要報告)</h3>
                <ul id="ng-items-list"></ul>
            </div>

            <div class="important-note">
                <strong>【重要確認】</strong><br>
                1. [cite_start]忘れ物の回収・入力内容の最終確認を行ってください [cite: 84]。<br>
                2. [cite_start]NG項目がある場合は、自動で稼働停止処理となります [cite: 85]。<br>
                3. [cite_start]入力間違いや報告漏れで「稼働停止にすべき案件」があった場合は、必ずTCOMへ連絡してください [cite: 89, 90]。<br>
                4. [cite_start]点検終了後の修正はできません [cite: 86]。
            </div>

            <button class="btn-restart" onclick="restartApp()">最初から点検する</button>
        </div>
    </main>

    <footer id="action-buttons">
        <button class="btn-ng" onclick="handleNG()">NG</button>
        <button class="btn-ok" onclick="handleOK()">OK / 次へ</button>
        <button class="btn-back" onclick="handleBack()">1つ戻る</button>
    </footer>

    <script>
        [cite_start]// PDFの内容に基づくチェックリストデータ [cite: 1-82]
        const checkList = [
            "外回り点検を開始 (右前タイヤから反時計回り)",
            "TMAで指定空気圧をチェック",
            "右前タイヤ: 製造年週、亀裂、損傷、残溝、空気圧を確認しTMAに入力",
            "フロント周り: ボディの傷や凹みなどの損傷をTMAと照合確認",
            "左前タイヤ: 製造年週、亀裂、損傷、残溝、空気圧を確認しTMAに入力",
            "左サイド: ボディの傷や凹みなどの損傷をTMAと照合確認",
            "左後タイヤ: 製造年週、亀裂、損傷、残溝、空気圧を確認しTMAに入力",
            "リア周り: ボディの傷や凹みなどの損傷をTMAと照合確認",
            "ロゴステッカー、TOUCHシールの剥がれ・劣化を確認",
            "右後タイヤ: 製造年週、亀裂、損傷、残溝、空気圧を確認しTMAに入力",
            "右サイド: ボディの傷や凹みなどの損傷をTMAと照合確認", // PDFの文脈から補完
            "空気圧が規定値未満のタイヤにエアー補充",
            "TOUCHにカードをかざして解錠する",
            "車内点検を開始",
            "運転席ドアポケット: 消臭剤の有無・残量",
            "助手席ドアポケット: ゴミ袋、除菌シートの有無・残量",
            "グローブボックスからキーを取り出す",
            "発煙筒の期限をTMAと照合",
            "取扱説明書・メンテナンスノート・整備手帳の有無",
            "車検証・自賠責の車体番号が一致することを確認",
            "車検証などをグローブボックスに戻し、助手席を一番前へ",
            "自賠責保険・車検ステッカー・点検シールの有効期限",
            "車内の案内シール (禁煙、ゲート物件等) の状態",
            "ACCをONにする",
            "ウォッシャー液噴射・ワイパー作動・払拭状態・ゴム劣化",
            "ドライブレコーダーのランプ点灯 (緑/オレンジが正常)",
            "全パワーウィンドウの作動確認",
            "ETCカードが挿入されていないこと (目視確認)",
            "電源ソケット (シガーソケット) の通電",
            "ナビのオートパーキング履歴を削除",
            "ACCをOFFにする",
            "ボンネット及び給油口のオープナーを作動させる",
            "ボンネット内点検を開始",
            "ブレーキフルード液量",
            "ラジエター冷却水液量",
            "ウォッシャー液量 (規定量まで補充)",
            "エンジンオイルの量及び汚れ",
            "車内清掃を開始",
            "運転席周りの清掃 (内窓、掃除機、ブラッシング)",
            "後部座席の清掃 (内窓、掃除機、ブラッシング)",
            "トランクの清掃 (内窓、掃除機、ブラッシング)",
            "トランク内備品を確認",
            "清掃キット (コロコロ、除菌シート) の有無",
            "三角停止表示板の有無・破損",
            "ジャッキ・車載工具の有無",
            "パンク修理キットの有無・有効期限 (TMAと照合)",
            "スペアタイヤの有無・空気圧・亀裂・損傷",
            "ジュニアシートの有無",
            "助手席周りの清掃 (内窓、掃除機、ブラッシング)",
            "仕上げ拭き (ナビ画面、バックミラー、フロントガラス内側)",
            "備品の補充 (消臭剤、ゴミ袋、除菌シート等) を行う",
            "エンジン始動後の最終点検を開始",
            "エンジンを始動し、始動状態・異音・電圧を確認",
            "始動後のブレーキの踏みしろ・効きを確認",
            "メーター内の全チェックランプが消灯することを確認",
            "シートベルトのゆるみ、警告灯の作動・消灯を確認",
            "安全装置 (コーナーセンサー、ブレーキサポート等) をONにする",
            "エアコンの作動 (冷風・異臭) を確認",
            "灯火類・ブレーキランプの確認",
            "ライト、ハザードを点灯させ、ギアをバック(R)に入れる",
            "バックモニターを確認",
            "駐車ブレーキの引きしろを確認",
            "エンジンを OFF または ACC にする",
            "フロント外窓を拭く＋ライト・ハザード・レンズ損傷確認",
            "左側面の外窓を拭く",
            "リア外窓を拭く＋テール・バック・ハザード・レンズ損傷確認",
            "車に戻り、ライトとハザードをOFFにする",
            "フットブレーキを固定具で保持する",
            "両後方でブレーキランプの点灯を確認",
            "車に戻り、固定具を外し、ギアをパーキング(P)に戻す",
            "最終報告と施錠を開始",
            "運転席にて TMAに必要な情報を入力する",
            "ODOメーター (総走行距離) 入力",
            "給油カードの番号・有効期限 (照らし合わせ)",
            "忘れ物があればTMAに入力する",
            "グローブボックス内にキーを戻す",
            "ルームランプスイッチを「DOOR」の位置に設定",
            "専用カードで施錠する",
            [cite_start]"【最重要】ドアノブを物理的に引き、施錠を最終確認 [cite: 80]",
            "駐車時確認: バリアポップを設置",
            "TMAでの作業終了報告をもって、業務完了とする"
        ];

        let currentIndex = 0;
        let ngItems = [];

        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');
        const itemText = document.getElementById('item-text');
        const cardArea = document.getElementById('card-area');
        const resultArea = document.getElementById('result-area');
        const appHeader = document.getElementById('app-header');
        const actionButtons = document.getElementById('action-buttons');
        const ngSection = document.getElementById('ng-section');
        const ngItemsList = document.getElementById('ng-items-list');
        const resultMessage = document.getElementById('result-message');

        function init() {
            render();
        }

        function render() {
            const progress = ((currentIndex + 1) / checkList.length) * 100;
            progressBar.style.width = `${progress}%`;
            statusText.textContent = `${currentIndex + 1} / ${checkList.length}`;
            itemText.textContent = checkList[currentIndex];
        }

        function handleOK() {
            if (currentIndex < checkList.length - 1) {
                currentIndex++;
                render();
            } else {
                finishCheck();
            }
        }

        function handleNG() {
            if (!ngItems.includes(currentIndex)) {
                ngItems.push(currentIndex);
            }
            if (currentIndex < checkList.length - 1) {
                currentIndex++;
                render();
            } else {
                finishCheck();
            }
        }

        function handleBack() {
            if (currentIndex > 0) {
                const prevIndex = currentIndex - 1;
                // 戻った項目のNG履歴は一旦消去（やり直しのため）
                ngItems = ngItems.filter(idx => idx !== prevIndex);
                currentIndex--;
                render();
            }
        }

        function finishCheck() {
            // UI切り替え
            cardArea.classList.add('hidden');
            appHeader.classList.add('hidden'); // ヘッダーも隠すか、結果画面用に変える手もあるが今回は隠す
            actionButtons.classList.add('hidden');
            resultArea.classList.remove('hidden');

            ngItemsList.innerHTML = '';

            if (ngItems.length > 0) {
                resultMessage.innerHTML = '<p style="color:var(--danger-color); font-weight:bold; font-size:24px; text-align:center;">⚠️ 確認事項があります</p>';
                ngSection.classList.remove('hidden');
                
                ngItems.forEach(idx => {
                    const li = document.createElement('li');
                    li.textContent = `[No.${idx + 1}] ${checkList[idx]}`;
                    ngItemsList.appendChild(li);
                });
            } else {
                resultMessage.innerHTML = '<p class="result-success">🎉 異常なし<br>お疲れ様でした！</p>';
                ngSection.classList.add('hidden');
            }
        }

        function restartApp() {
            if(confirm('チェックを最初からやり直しますか？')) {
                currentIndex = 0;
                ngItems = [];
                cardArea.classList.remove('hidden');
                appHeader.classList.remove('hidden');
                actionButtons.classList.remove('hidden');
                resultArea.classList.add('hidden');
                render();
            }
        }

        init();
    </script>
</body>
</html>
