<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>車両点検チェックリスト</title>
<style>
:root {
  --success-color: #00ff00;
  --danger-color: #ff0000;
  --bg-color: #000000;
  --text-color: #ffffff;
  --header-height: 60px;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
body {
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  position: fixed;
}
header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--header-height);
  background-color: var(--bg-color);
  z-index: 100;
  padding: 10px 20px;
  border-bottom: 1px solid #333;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  color: #cccccc;
  margin-bottom: 5px;
}
.progress-container {
  width: 100%;
  height: 4px;
  background-color: #333;
  border-radius: 2px;
}
.progress-bar {
  height: 100%;
  background-color: var(--success-color);
  width: 0%;
  transition: width 0.1s;
}
main {
  position: absolute;
  top: var(--header-height);
  bottom: 120px;
  left: 0;
  width: 100%;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
}
.card {
  width: 100%;
  max-width: 600px;
  text-align: center;
}
.check-item-text {
  color: #ffffff;
  font-size: 26px;
  font-weight: bold;
  line-height: 1.4;
}
footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background-color: var(--bg-color);
  z-index: 100;
  border-top: 1px solid #333;
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 10px;
  padding: 15px;
  padding-bottom: max(20px, env(safe-area-inset-bottom));
}
button {
  background-color: #000000;
  border-radius: 8px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  padding: 15px 0;
  color: #ffffff;
}
button:active {
  background-color: #222;
}
.btn-ng {
  border: 2px solid var(--danger-color);
  color: var(--danger-color);
  grid-column: 1;
}
.btn-ok {
  border: 2px solid var(--success-color);
  color: var(--success-color);
  grid-column: 2;
}
.btn-back {
  grid-column: 1 / -1;
  border: 1px solid #666;
  color: #aaaaaa;
  padding: 10px 0;
  font-size: 14px;
}
.result-container {
  width: 100%;
  padding-bottom: 50px;
}
.result-title { text-align: center; margin-bottom: 20px; font-size: 24px; }
.ng-list { border: 1px solid var(--danger-color); padding: 15px; margin: 20px 0; border-radius: 8px; text-align: left; }
.ng-list li { border-bottom: 1px solid #333; padding: 8px 0; list-style: none; }
.hidden { display: none !important; }
.important-note { border: 1px solid #ffcc00; color: #ffcc00; padding: 10px; font-size: 13px; margin-top: 20px; border-radius: 5px; text-align: left; }
.btn-restart { border: 1px solid #fff; margin-top: 20px; width: 100%; }
</style>
</head>
<body>

<header>
  <div class="progress-info">
    <span id="status-text">1 / 82</span>
    <span>点検中</span>
  </div>
  <div class="progress-container">
    <div class="progress-bar" id="progress-bar" style="width: 1%;"></div>
  </div>
</header>

<main id="main-content">
  <div class="card" id="card-area">
    <div class="check-item-text" id="item-text">
      外回り点検を開始(右前タイヤから反時計回り)
    </div>
  </div>

  <div class="result-container hidden" id="result-area">
    <h2 class="result-title" id="result-header">点検完了</h2>
    <div id="result-msg"></div>
    <div id="ng-box" class="ng-list hidden">
      <h3 style="color:var(--danger-color)">⚠️ NG項目リスト</h3>
      <ul id="ng-ul"></ul>
    </div>
    <div class="important-note">
      <strong>【重要】</strong><br>
      NG項目がある場合は、TCOMへ連絡し指示を仰いでください。<br>
      終了ボタンを押す前に、忘れ物がないか再確認してください。
    </div>
    <button class="btn-restart" id="btn-restart">最初から点検する</button>
  </div>
</main>

<footer id="footer">
  <button class="btn-ng" id="btn-ng">NG</button>
  <button class="btn-ok" id="btn-ok">OK / 次へ</button>
  <button class="btn-back" id="btn-back">1つ戻る</button>
</footer>

<script>
(function() {
  var list = [
    "外回り点検を開始(右前タイヤから反時計回り)",
    "TMAで指定空気圧をチェック",
    "右前タイヤ 製造年週、亀裂、損傷など、残溝、空気圧をチェックしTMAに入力",
    "フロント周りのボディの傷や凹みなどの損傷をTMAと照合しながら確認",
    "左前タイヤ 製造年週、亀裂、損傷など、残溝、空気圧をチェックしTMAに入力",
    "左サイドのボディの傷や凹みなどの損傷をTMAと照合しながら確認",
    "左後タイヤ 製造年週、亀裂、損傷など、残溝、空気圧をチェックしTMAに入力",
    "リア周りのボディの傷や凹みなどの損傷をTMAと照合しながら確認",
    "ロゴステッカー、TOUCHシールの剥がれ・劣化を確認",
    "右後タイヤ 製造年週、亀裂、損傷など、残溝、空気圧をチェックしTMAに入力",
    "左サイドのボディの傷や凹みなどの損傷をTMAと照合しながら確認",
    "空気圧が規定値未満のタイヤにエアー補充",
    "TOUCHにカードをかざして解錠する",
    "車内点検を開始",
    "運転席ドアポケット: 消臭剤の有無・残量",
    "助手席ドアポケット:ゴミ袋、除菌シートの有無・残量",
    "グローブボックスからキーを取り出す",
    "発煙筒の期限をTMAと照合",
    "取扱説明書・メンテナンスノート・整備手帳の有無",
    "車検証・自賠責の車体番号が一致することを確認",
    "車検証などをグローブボックスに戻し助手席を一番前へスライドさせる",
    "自賠責保険・車検ステッカー・点検シールの有効期限",
    "車内の案内シール(禁煙、ゲート物件等)の状態",
    "ACCをONにする",
    "ウォッシャー液噴射・ワイパー作動・払拭状態・ゴム劣化",
    "ドライブレコーダーのランプ点灯(緑/オレンジが正常)",
    "全パワーウィンドウの作動",
    "ETC カードが挿入されていないこと(目視確認)",
    "電源ソケット(シガーソケット)の通電",
    "ナビのオートパーキング履歴を削除",
    "ACCをOFFにする",
    "ボンネット及び給油口のオープナーを作動させる",
    "ボンネット内点検を開始",
    "ブレーキフルード液量",
    "ラジエター冷却水液量",
    "ウォッシャー液量(規定量まで補充)",
    "エンジンオイルの量及び汚れ",
    "車内清掃を開始",
    "運転席周りの清掃(内窓、掃除機、ブラッシング)",
    "後部座席の清掃(内窓、掃除機、ブラッシング)",
    "トランクの清掃(内窓、掃除機、ブラッシング)",
    "トランク内備品を確認",
    "清掃キット(コロコロ、除菌シート)の有無",
    "三角停止表示板の有無・破損",
    "ジャッキ・車載工具の有無",
    "パンク修理キットの有無・有効期限(TMAと照合)",
    "スペアタイヤの有無・空気圧・亀裂・損傷",
    "ジュニアシートの有無",
    "助手席周りの清掃(内窓、掃除機、ブラッシング)",
    "仕上げ拭き(ナビ画面、バックミラー、フロントガラス内側)",
    "備品の補充(消臭剤、ゴミ袋、除菌シート等)を行う",
    "エンジン始動後の最終点検を開始",
    "エンジンを始動し、始動状態・異音・電圧を確認",
    "始動後のブレーキの踏みしろ・効きを確認",
    "メーター内の全チェックランプが消灯することを確認",
    "シートベルトのゆるみ、警告灯の作動・消灯を確認",
    "安全装置(コーナーセンサー、ブレーキサポート等)をONにする",
    "エアコンの作動(冷風・異臭)を確認",
    "灯火類・ブレーキランプの確認",
    "ライト、ハザードを点灯させ、ギアをバック(R)に入れる",
    "バックモニターを確認",
    "駐車ブレーキの引きしろを確認",
    "エンジンを OFF または ACC にする",
    "フロント外窓を拭きながらヘッドライト、ハザードの点灯・レンズ損傷を確認",
    "左側面の外窓を拭く",
    "リア外窓を拭きながらテールランプ、バックランプ、ハザードの点灯・レンズ損傷を確認",
    "車に戻り、ライトとハザードをOFFにする",
    "フットブレーキを固定具で保持する",
    "両後方でブレーキランプの点灯を確認",
    "車に戻り、固定具を外し、ギアをパーキング (P)に戻す",
    "最終報告と施錠を開始",
    "運転席にて TMAに必要な情報を入力する",
    "ODO メーター(総走行距離)",
    "給油カードの番号・有効期限(照らし合わせ)",
    "忘れ物があればTMAに入力する",
    "グローブボックス内にキーを戻す",
    "ルームランプスイッチを「DOOR」の位置に設定する",
    "専用カードで施錠する",
    "【最重要】ドアノブを物理的に引き、施錠を最終確認する",
    "駐車時確認:バリアポップを設置",
    "TMAでの作業終了報告をもって、業務完了とする"
  ];

  var idx = 0;
  var ngs = [];
  
  var elBar = document.getElementById('progress-bar');
  var elStatus = document.getElementById('status-text');
  var elText = document.getElementById('item-text');
  var elCard = document.getElementById('card-area');
  var elRes = document.getElementById('result-area');
  var elMain = document.getElementById('main-content');
  var elFoot = document.getElementById('footer');
  var elHead = document.getElementById('result-header');
  var elMsg = document.getElementById('result-msg');
  var elNgBox = document.getElementById('ng-box');
  var elNgUl = document.getElementById('ng-ul');

  function render() {
    var total = list.length;
    var now = idx + 1;
    elBar.style.width = (now / total * 100) + '%';
    elStatus.textContent = now + ' / ' + total;
    elText.textContent = list[idx];
  }

  function finish() {
    elCard.style.display = 'none';
    document.querySelector('header').style.display = 'none';
    elFoot.style.display = 'none';
    elRes.classList.remove('hidden');
    elRes.style.display = 'block';

    elNgUl.innerHTML = '';
    if (ngs.length > 0) {
      elHead.textContent = "確認事項あり";
      elHead.style.color = "var(--danger-color)";
      elMsg.innerHTML = '<p style="text-align:center; margin-bottom:10px;">NG項目があります。</p>';
      elNgBox.classList.remove('hidden');
      for (var i = 0; i < ngs.length; i++) {
        var n = ngs[i];
        var li = document.createElement('li');
        li.textContent = '[' + (n + 1) + '] ' + list[n];
        elNgUl.appendChild(li);
      }
    } else {
      elHead.textContent = "業務完了";
      elHead.style.color = "var(--success-color)";
      elMsg.innerHTML = '<p style="text-align:center;">異常はありません。</p>';
      elNgBox.classList.add('hidden');
    }
  }

  document.getElementById('btn-ok').addEventListener('click', function() {
    if (idx < list.length - 1) {
      idx++;
      render();
    } else {
      finish();
    }
  });

  document.getElementById('btn-ng').addEventListener('click', function() {
    if (ngs.indexOf(idx) === -1) {
      ngs.push(idx);
    }
    if (idx < list.length - 1) {
      idx++;
      render();
    } else {
      finish();
    }
  });

  document.getElementById('btn-back').addEventListener('click', function() {
    if (idx > 0) {
      var prev = idx - 1;
      var f = ngs.indexOf(prev);
      if (f !== -1) {
        ngs.splice(f, 1);
      }
      idx--;
      render();
    }
  });

  document.getElementById('btn-restart').addEventListener('click', function() {
    if (confirm("最初からやり直しますか？")) {
      idx = 0;
      ngs = [];
      elCard.style.display = 'block';
      document.querySelector('header').style.display = 'flex';
      elFoot.style.display = 'grid';
      elRes.classList.add('hidden');
      elRes.style.display = 'none';
      render();
    }
  });

  function layout() {
    if (elMain && elFoot) {
      elMain.style.bottom = elFoot.offsetHeight + 'px';
    }
  }
  window.addEventListener('load', layout);
  window.addEventListener('resize', layout);

})();
</script>
</body>
</html>
